name: EVM Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "evm/**"
      - "test-vectors/**"
      - ".github/workflows/evm-contracts.yml"
  pull_request:
  workflow_call:
  workflow_dispatch:

# Both jobs only read: checkout, install toolchains, build, test. Nothing here writes to the repo,
# so the token is scoped down to that rather than left at the default.
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: EVM Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The event circuit lives in proofbridge-circuits; the VK build below needs it.
      - name: Checkout proofbridge-circuits
        uses: actions/checkout@v4
        with:
          repository: Explore-Beyond-Innovations/proofbridge-circuits
          path: proof_circuits

      # The monorepo layout puts proof_circuits one level above evm/ and stellar/
      # (the scripts resolve it relative to their own dir), so mirror the checkout
      # at the workspace parent too.
      - name: Link circuits at monorepo-relative path
        run: ln -sfn "$GITHUB_WORKSPACE/proof_circuits" "$(dirname "$GITHUB_WORKSPACE")/proof_circuits"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: the UnlockGas ceilings were baselined on 1.7.1; forge 1.8.x meters
          # ~56k more gas on the same code, so `stable` fails the gate on main too.
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 20, matching the monorepo's copy of this workflow: the two run the same steps and a
          # gate whose halves run on different runtimes will eventually pass on one and fail on
          # the other.
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Forge fmt
        run: forge fmt --check
        id: fmt

      # Sizes are checked for what ships. The test tree pulls in ModuleKit's account factories,
      # which are far over EIP-170 and were never going on chain; the test step compiles them.
      - name: Run Forge build
        run: forge build --sizes --skip test
        id: build

      - name: Build event circuit
        run: scripts/build_circuits.sh proof_circuits/events
        working-directory: .

      # Verifier.sol must be exactly bb's output for the circuit's key.
      - name: Verifier matches the circuit
        run: scripts/gen-verifier.sh --check
        working-directory: .

      # Piped through a passed-count check: a renamed contract must fail the
      # step, not skip it (forge exits 0 on zero matches).
      - name: Order-hash parity (EVM)
        run: |
          set -o pipefail
          forge test --match-contract OrderHashParity -vvv | tee /tmp/parity.log
          grep -qE 'Suite result: ok\. [1-9][0-9]* passed' /tmp/parity.log

      # Invariants are excluded here and run in the `invariants` job below: they are 596s of this
      # suite's 647s, so leaving them in makes every other signal wait on them. ValidationRules skips
      # itself here (it needs a tracer and its own gas limit) and runs in the step after this one.
      - name: Run Forge tests
        run: forge test -vvv --no-match-contract Invariant
        id: test

      # The agent module's storage layout is load-bearing and invisible: an account-first mapping
      # compiles, passes every functional test, and produces a module no bundler will carry. This
      # runs the real ERC-4337 validation rules over it.
      #
      # `-vvv` is required, not cosmetic: the simulator reads the debug tracer, which forge only
      # initialises at that verbosity. The gas limit is raised because the trace itself is metered
      # and the default 2^30 runs out part-way through parsing it.
      - name: ERC-4337 validation rules (2.1g)
        run: |
          set -o pipefail
          AGENT_RULES=1 forge test --match-contract ValidationRules --gas-limit 900000000000 -vvv | tee /tmp/rules.log
          grep -qE 'Suite result: ok\. [1-9][0-9]* passed' /tmp/rules.log
        id: validation-rules

      # The same module against every account implementation people actually use. A policy that
      # holds on one and not another is the failure this catches. ValidationRules is left out: its
      # simulation is about the module's own storage rather than the account's, and turning it on
      # is a process-wide switch.
      - name: Agent module on every 7579 account (2.1g)
        run: |
          set -o pipefail
          for account in DEFAULT SAFE KERNEL NEXUS; do
            echo "::group::$account"
            # One suite per run and one grep per suite: a glob over the directory would keep the
            # step green on four suites while a fifth quietly stopped matching.
            for suite in ModuleKitSmokeTest AgentPolicyCodecTest AgentPolicyUnitTest \
                         AgentPolicyEnforcementTest AgentPolicyReviewTest AgentPolicyReviewPass1Test; do
              ACCOUNT_TYPE=$account forge test --match-contract "^${suite}\$" -vvv | tee /tmp/agent.log
              grep -qE 'Suite result: ok\. [1-9][0-9]* passed' /tmp/agent.log
            done
            echo "::endgroup::"
          done
        id: agent-accounts

      - name: Unlock gas baseline gate (1.6c)
        run: |
          set -o pipefail
          forge test --match-contract UnlockGas -vv | tee /tmp/gas.log
          grep -qE 'Suite result: ok\. [1-9][0-9]* passed' /tmp/gas.log
        id: gas-baseline

  invariants:
    name: EVM Invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same pin as the `check` job: an unpinned nightly would let the two jobs run different forge
      # versions, and the campaign's meaning depends on the fuzzer.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # forge compiles the whole test tree even for a filtered run, and the agent tests import
      # ModuleKit from node_modules — so this job needs the install too or nothing compiles.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # The full campaign, on pull requests as well as on main: 256 runs x 500 calls per invariant.
      # Splitting this into its own job does not make it faster — it is the critical path, and
      # parallelism cannot shorten a long pole — but it keeps the fast signals from waiting on it.
      - name: Invariant campaigns
        run: |
          set -o pipefail
          forge test --match-contract Invariant -vvv | tee /tmp/inv.log
          # forge exits 0 on zero matches, so a renamed contract must fail the step rather than
          # silently skip the campaigns — the same trap the parity step guards against.
          grep -qE 'Suite result: ok\. [1-9][0-9]* passed' /tmp/inv.log
