name: Stellar Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "stellar/**"
      # the Rust readers include_str! files from here
      - "test-vectors/**"
      - ".github/workflows/stellar-contracts.yml"
  pull_request:
  workflow_call:
  workflow_dispatch:

# Every job only reads the repo; the token is scoped down to that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: stellar

  # The cargo registry cache's only writer: main pushes, this repo's lockfile, no circuit code.
  cargo-cache:
    name: Cargo registry cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the cargo registry
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-stellar-${{ hashFiles('stellar/Cargo.lock') }}

      - name: Fetch the locked dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: cargo fetch --locked
        working-directory: stellar

      - name: Save the cargo registry
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-stellar-${{ hashFiles('stellar/Cargo.lock') }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # The event circuit lives in proofbridge-circuits; the VK build below needs it.
      # Pinned to CIRCUITS_COMMIT, the commit the monorepo's proof_circuits pointer names (a repo-check
      # there keeps the two equal). Checking out main tested the VK against circuits nobody deployed.
      - name: Read the pinned circuits commit
        id: circuits
        working-directory: .
        # A-9: an empty or malformed pin must fail here, not silently check out circuits main.
        run: |
          sha="$(tr -d '[:space:]' < CIRCUITS_COMMIT)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CIRCUITS_COMMIT must be a full 40-hex commit, got '${sha}'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout proofbridge-circuits
        uses: actions/checkout@v4
        with:
          repository: Explore-Beyond-Innovations/proofbridge-circuits
          ref: ${{ steps.circuits.outputs.sha }}
          path: proof_circuits

      # The monorepo layout puts proof_circuits one level above evm/ and stellar/
      # (the scripts resolve it relative to their own dir), so mirror the checkout
      # at the workspace parent too.
      - name: Link circuits at monorepo-relative path
        run: ln -sfn "$GITHUB_WORKSPACE/proof_circuits" "$(dirname "$GITHUB_WORKSPACE")/proof_circuits"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32v1-none target
        run: rustup target add wasm32v1-none

      # Restore only: this job runs code from the circuits checkout, so it never writes a cache that
      # a later run would trust. The `cargo-cache` job is the only writer, and it runs no circuit code.
      - name: Restore the cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-stellar-${{ hashFiles('stellar/Cargo.lock') }}

      - name: Install Stellar CLI
        env:
          # GitHub's published digest for this asset, checked against a fresh download.
          STELLAR_CLI_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar-cli.tar.gz
          echo "${STELLAR_CLI_SHA256}  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        # No pnpm cache: setup-node would save one from a job that runs circuit code.
        with:
          node-version: "18"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # stellar/deploy is type-checked in the monorepo's copy of this workflow: it depends on
      # @proofbridge/deployment-manifest, which this repo's workspace does not carry.

      # --optimize (bare flag on the pinned v28.0.0 CLI) opts the build into
      # wasm-opt, so the metered/deployed bytes are optimized. On a CLI compiled
      # without the optimize feature the flag is rejected and the build fails
      # instead of silently shipping unoptimized wasm. The metering gate
      # (integration_test.rs) is the backstop — unoptimized unlock meters over the
      # 106M regression ceiling and fails there. (The ceiling is a tripwire just above the
      # measurement, not the network budget — that is 400M.)
      - name: Build contract WASMs
        run: |
          stellar contract build --optimize --package ad-manager
          stellar contract build --optimize --package order-portal
          stellar contract build --optimize --package merkle-manager
          stellar contract build --optimize --package verifier
          stellar contract build --optimize --package counterparty-verifier
          stellar contract build --optimize --package agent-account
          stellar contract build --optimize --package bls-key-registry
          stellar contract build --optimize --package root-anchor
          stellar contract build --optimize --package registrar
          stellar contract build --optimize --package dispute-manager
        working-directory: stellar

      - name: Build event circuit
        run: scripts/build_circuits.sh proof_circuits/events

      - name: Build verifier test circuits
        run: scripts/build_circuits.sh stellar/contracts/verifier/tests --prove

      - name: Run unit tests
        run: cargo test --workspace --exclude proofbridge-stellar
        working-directory: stellar

      # Both packages must actually run the parity test: cargo exits 0 when a
      # renamed filter matches nothing, silently deleting the guard.
      - name: Order-hash parity (Stellar)
        run: |
          set -o pipefail
          cargo test -p ad-manager -p order-portal order_hash_parity -- --nocapture | tee /tmp/parity.log
          test "$(grep -cE 'test result: ok\. [1-9][0-9]* passed' /tmp/parity.log)" -eq 2
        working-directory: stellar

      # T-60 (2.1h): the Rust readers of the two shared policy tables. The count of tests in each
      # reader's file must all pass, and a floor notices one being deleted, as on the EVM side.
      - name: Agent-policy parity (Stellar)
        run: |
          set -o pipefail
          for reader in proofbridge-core:parity_math:lib/proofbridge-core/src/parity_math_test.rs:2 agent-account:parity_test:contracts/agent-account/src/parity_test.rs:2; do
            IFS=: read -r package filter file floor <<< "$reader"
            expected=$(grep -cE '^#\[test\]' "$file")
            echo "$package/$filter: $expected tests in the file, floor $floor"
            if [ "$expected" -lt "$floor" ]; then echo "::error::$file has $expected tests, fewer than the floor of $floor: was one deleted?"; exit 1; fi
            cargo test -p "$package" "$filter" -- --nocapture | tee /tmp/policy-parity.log
            if ! grep -qE "test result: ok\\. $expected passed; 0 failed" /tmp/policy-parity.log; then
              echo "::error::$package/$filter: wanted exactly $expected passed, 0 failed; got: $(grep -E 'test result' /tmp/policy-parity.log || echo 'no test ran')"; exit 1
            fi
          done
        working-directory: stellar

      # The order-hash fixture drift guard (@proofbridge/bls-vectors) runs in the
      # ProofBridge monorepo, which owns the vector generator.

      - name: Generate integration test fixtures
        run: npx tsx generate_fixtures.ts
        working-directory: stellar/tests/fixtures

      - name: Run integration tests
        run: cargo test --test integration_test -- --nocapture
        working-directory: stellar

      - name: Unlock compute-cost baseline gate (1.6c)
        run: |
          set -o pipefail
          cargo test --test integration_test test_unlock_metering -- --nocapture | tee /tmp/metering.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/metering.log
        working-directory: stellar
