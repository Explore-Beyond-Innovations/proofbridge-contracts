name: CodeQL

# Advanced setup, so the analysis can read .github/codeql/codeql-config.yml (default setup cannot).
# The repository's default setup has to be switched off for these uploads to be accepted.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # A normal run is 5 min or less per language; a hung Rust extractor took a runner for 47 min on 2026-10-12.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The languages default setup analysed; none needs a build.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
