name: proofbridge-contracts

# Rust test sources pin fixed keys, nonces and seeds on purpose (deterministic vectors), which
# rust/hard-coded-cryptographic-value reports as findings. Contract code stays analysed; only the
# unit and integration test files are left out. test-token is a deployed contract, so it stays in.
paths-ignore:
  - stellar/contracts/*/src/test.rs
  - stellar/contracts/*/src/*_test.rs
  - stellar/lib/*/src/test.rs
  - stellar/lib/*/src/*_test.rs
  - stellar/tests/**
