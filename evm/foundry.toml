[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
remappings = [
  "@poseidon2/=lib/poseidon2-evm/",
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
  'forge-std=lib/forge-std/src/',
  'solady=lib/solady/src/',
  '@solidity-mmr=lib/solidity-mmr/src/',
  '@scl/=lib/crypto-lib/src/',
  # ModuleKit (test-only, 2.1g). It ships as an npm package rather than a foundry submodule, so its
  # dependencies are declared in evm/package.json to land beside it in node_modules; a path that
  # hopped out of the package with `..` resolves above the project root and solc refuses it.
  'modulekit/=node_modules/@rhinestone/modulekit/src/',
  # ModuleKit has one self-referential import (`src/external/ERC4337.sol`); the prefix is longer
  # than our own `src/`, so it cannot shadow `src/interfaces/...` in this repo's tests.
  'src/external/=node_modules/@rhinestone/modulekit/src/external/',
  '@ERC4337/=node_modules/@ERC4337/',
  'account-abstraction/=node_modules/@ERC4337/account-abstraction/contracts/',
  'account-abstraction-v0.6/=node_modules/@ERC4337/account-abstraction-v0.6/contracts/',
  'erc4337-validation/=node_modules/@rhinestone/erc4337-validation/src/',
  '@rhinestone/sentinellist/=node_modules/@rhinestone/sentinellist/src/',
  'solarray/=node_modules/solarray/src/',
  '@prb/math/=node_modules/@prb/math/src/',
  'ExcessivelySafeCall/=node_modules/excessively-safe-call/src/',
  'ds-test/=node_modules/ds-test/src/',
]
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
solc_version = "0.8.34"
evm_version = "prague"
fs_permissions = [{ access = "read", path = "../test-vectors" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]

# Pinned, not left to forge's defaults: the CI comment below and the campaign's meaning both depend
# on the size, so a change to a forge default must not quietly change what "the full campaign" is.
[invariant]
runs = 256
depth = 500
fail_on_revert = false

[rpc_endpoints]
testnet = "${RPC_URL}"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Invariant campaigns dominate this suite: measured locally, the invariant contracts take 596s while
# every other test in the repo totals 51s. They are the critical path, so they run as their own CI
# job — not to make them faster, which parallelism cannot do to a long pole, but so the fast signals
# (unit, gas, parity) stop queueing behind ten minutes of fuzzing.
#
# The campaign itself is deliberately NOT reduced on pull requests. The full 256 x 500 runs before a
# change merges, not after it.
#
# If that ever needs trading down, the measurements say cut `runs`, not `depth`: 128 x 250 and
# 64 x 500 are both 32,000 calls, but the first takes 83s and the second 168s — deep sequences
# accumulate state and each call slows. And depth buys little here, since a dispute lifecycle is
# five to ten calls.
