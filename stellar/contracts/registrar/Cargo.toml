[package]
name = "registrar"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
proofbridge-core = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
merkle-manager = { path = "../merkle-manager", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
