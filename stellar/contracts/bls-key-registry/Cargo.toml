[package]
name = "bls-key-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
proofbridge-core = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
hex = { workspace = true }
serde_json = "1"
stellar-strkey = { workspace = true }

[features]
testutils = ["soroban-sdk/testutils"]
