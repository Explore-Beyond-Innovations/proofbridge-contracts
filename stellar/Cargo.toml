[package]
name = "proofbridge-stellar"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proofbridge-core = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
stellar-strkey = { workspace = true }
sha3 = { workspace = true }
stellar-tokens = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
resolver = "2"
members = ["contracts/*", "lib/*"]

[workspace.dependencies]
ed25519-dalek = { version = "2.2" }
hex = "0.4"
sha3 = { version = "0.11", default-features = false }
soroban-sdk = { version = "28.0.0-rc.1", features = ["alloc"] }
soroban-poseidon = { git = "https://github.com/Explore-Beyond-Innovations/rs-soroban-poseidon.git", rev = "c1847afffdcc3a71d38ab1dbf4a816c59622a5ea" }
stellar-tokens = { git = "https://github.com/Explore-Beyond-Innovations/stellar-contracts.git", rev = "e0daf73aa8dd47d430ac12c18743dd3c8bbb4113" }
stellar-strkey = "0.0.16"
ultrahonk_soroban_verifier = { git = "https://github.com/Explore-Beyond-Innovations/rs-soroban-ultrahonk.git", rev = "7f29f9add465c50da86f362e6190b85efad4e6ed" }
rand = "0.8"

# internal
proofbridge-core = { path = "lib/proofbridge-core" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
